<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUANT-DEPTH // MATTHEW PIERCE</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-black: #000000;
      --panel-dark: #0A0D12;
      --border-platinum: rgba(229, 228, 226, 0.25);
      
      /* Metallic Platinum Palette */
      --plat-light: #FFFFFF;
      --plat-mid: #E5E4E2;
      --plat-dark: #8C8C8C;
      --plat-deep: #404040;
      
      /* Chart Accent States (Platinum Tinted) */
      --plat-red: #FF4D4D;
      --plat-green: #00E676;
      --plat-blue: #E0E8F5;

      --text-main: #F2F2F2;
      --text-muted: #8E95A2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding: 16px;
    }

    /* Top Centered Header */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-platinum);
      margin-bottom: 16px;
      position: relative;
    }

    /* Platinum Text Metallic Gradient */
    .author-name {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFFFFF 0%, #E5E4E2 25%, #7D7D7D 50%, #FFFFFF 75%, #B5B5B5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(229, 228, 226, 0.3);
    }

    .sub-header {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--plat-dark);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .live-badge {
      position: absolute;
      right: 12px;
      top: 4px;
      font-size: 0.75rem;
      color: #E5E4E2;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 10px #FFFFFF;
    }

    /* Main Grid Layout */
    .main-container {
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    /* Platinum Metallic Panel Box */
    .panel {
      background: linear-gradient(180deg, #0A0D12 0%, #040507 100%);
      border: 1px solid var(--border-platinum);
      border-radius: 10px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 10px 30px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .metric-card {
      background: linear-gradient(145deg, #0D1117 0%, #05070A 100%);
      border: 1px solid rgba(229, 228, 226, 0.2);
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .metric-label {
      font-size: 0.7rem;
      color: var(--plat-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .metric-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: #FFFFFF;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    /* Controls */
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    
    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--plat-mid);
      display: flex;
      justify-content: space-between;
      letter-spacing: 0.5px;
    }

    /* Platinum Styled Slider */
    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #1A202C;
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FFFFFF, #999999);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      border: 1px solid #FFFFFF;
    }

    /* Platinum Metallic Action Button */
    .btn-plat {
      background: linear-gradient(135deg, #FFFFFF 0%, #C0C0C0 50%, #808080 100%);
      color: #000000;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.15);
    }

    .btn-plat:hover {
      background: linear-gradient(135deg, #FFFFFF 0%, #E5E4E2 50%, #A9A9A9 100%);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    /* Chart Container */
    .chart-container {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    /* Status Bar */
    .status-box {
      background: rgba(229, 228, 226, 0.05);
      border-left: 3px solid var(--plat-mid);
      padding: 12px;
      font-size: 0.8rem;
      border-radius: 4px;
      color: var(--plat-mid);
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Top Centered Metallic Header -->
  <header>
    <div class="author-name">MATTHEW PIERCE</div>
    <div class="sub-header">QUANT-DEPTH // CAD-MXN LIQUIDITY VACUUM ENGINE</div>
    <div class="live-badge">
      <div class="live-dot"></div> PLATINUM TERMINAL
    </div>
  </header>

  <div class="main-container">
    <!-- Left Control Panel -->
    <div class="panel">
      <h3 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: var(--plat-dark);">Control Console</h3>
      
      <div class="control-group">
        <label>Liquidity Depth <span id="depth-val" style="color: #FFF;">15% (3 AM Illiquid)</span></label>
        <input type="range" id="depth" min="5" max="100" value="15">
      </div>

      <div class="control-group">
        <label>Institutional Buy <span id="order-val" style="color: #FFF;">$50M CAD</span></label>
        <input type="range" id="order" min="10" max="100" value="50" step="10">
      </div>

      <div class="control-group" style="flex-direction:row; justify-content:space-between; align-items:center;">
        <label style="margin:0;">Trigger Stop-Losses</label>
        <input type="checkbox" id="stoploss" checked style="width:18px; height:18px; accent-color: #E5E4E2;">
      </div>

      <button class="btn-plat" onclick="runSimulation()">RUN ORDER SWEEP</button>

      <div class="status-box" id="status-text">
        System initialized. Adjust parameters and execute order sweep to observe microstructural price movement.
      </div>
    </div>

    <!-- Right Dashboard -->
    <div style="display:flex; flex-direction:column; gap:16px;">
      <!-- Metric Cards -->
      <div class="metrics-grid">
        <div class="metric-card">
          <div class="metric-label">Spot Anchor</div>
          <div class="metric-value">12.30 MXN</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Peak Execution</div>
          <div class="metric-value" id="m-peak" style="color: var(--plat-light);">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Slippage Impact</div>
          <div class="metric-value" id="m-slippage" style="color: var(--plat-mid);">--</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Mean Reversion</div>
          <div class="metric-value" id="m-recovery" style="color: var(--plat-light);">12.90 MXN</div>
        </div>
      </div>

      <!-- Chart Panel -->
      <div class="panel chart-container">
        <canvas id="fxChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let chart;
    const ctx = document.getElementById('fxChart').getContext('2d');

    // Gradient Creator for Silver Chart Fill
    let gradientFill = ctx.createLinearGradient(0, 0, 0, 400);
    gradientFill.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
    gradientFill.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

    function initChart() {
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['02:00 AM', '02:30 AM', '03:00 AM (Order)', '03:05 AM (Peak)', '03:30 AM (Drop)', '08:00 AM (Open)'],
          datasets: [{
            label: 'CAD/MXN Spot Rate',
            data: [12.30, 12.30, 12.30, 12.30, 12.30, 12.30],
            borderColor: '#FFFFFF',
            borderWidth: 3,
            fill: true,
            backgroundColor: gradientFill,
            tension: 0.25,
            pointBackgroundColor: '#FFFFFF',
            pointBorderColor: '#000000',
            pointRadius: 6,
            pointHoverRadius: 9
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: {
              min: 12.00,
              max: 13.20,
              grid: { color: 'rgba(229, 228, 226, 0.1)' },
              ticks: { color: '#8C8C8C', font: { weight: '600' } }
            },
            x: {
              grid: { color: 'rgba(229, 228, 226, 0.1)' },
              ticks: { color: '#8C8C8C', font: { weight: '600' } }
            }
          }
        }
      });
    }

    // UI Updates
    document.getElementById('depth').addEventListener('input', (e) => {
      const v = e.target.value;
      document.getElementById('depth-val').innerText = v < 30 ? `${v}% (3 AM Illiquid)` : `${v}% (Active Market)`;
    });

    document.getElementById('order').addEventListener('input', (e) => {
      document.getElementById('order-val').innerText = `$${e.target.value}M CAD`;
    });

    // Simulation Execution Engine
    function runSimulation() {
      const depth = parseInt(document.getElementById('depth').value);
      const order = parseInt(document.getElementById('order').value);
      const stoploss = document.getElementById('stoploss').checked;

      const impactFactor = (order / depth) * 0.22;
      const peakPrice = Math.min(13.10, 12.30 + impactFactor).toFixed(2);
      const slippage = (((peakPrice - 12.30) / 12.30) * 100).toFixed(2);
      
      const dropPrice = stoploss ? 12.32 : (12.30 + (impactFactor * 0.4)).toFixed(2);
      const finalRecovery = 12.90;

      document.getElementById('m-peak').innerText = `${peakPrice} MXN`;
      document.getElementById('m-slippage').innerText = `+${slippage}%`;

      const newData = [12.30, 12.31, 12.30, parseFloat(peakPrice), parseFloat(dropPrice), finalRecovery];
      
      chart.data.datasets[0].data = [12.30, 12.30, 12.30, 12.30, 12.30, 12.30];
      chart.update();

      let i = 0;
      const statusText = document.getElementById('status-text');
      
      const interval = setInterval(() => {
        chart.data.datasets[0].data[i] = newData[i];
        
        if (i === 3) {
          chart.data.datasets[0].borderColor = '#FF4D4D'; // Platinum Red (Spike)
          chart.data.datasets[0].pointBackgroundColor = '#FF4D4D';
          statusText.innerText = `[03:05 AM] LIQUIDITY VACUUM: $${order}M order swept thin order book up to ${peakPrice} MXN.`;
        } else if (i === 4) {
          chart.data.datasets[0].borderColor = '#00E676'; // Platinum Green (Reversal)
          chart.data.datasets[0].pointBackgroundColor = '#00E676';
          statusText.innerText = `[03:30 AM] REVERSAL CASCADE: Automated stop-loss liquidations slammed spot back to ${dropPrice} MXN.`;
        } else if (i === 5) {
          chart.data.datasets[0].borderColor = '#FFFFFF'; // Silver Platinum Final
          chart.data.datasets[0].pointBackgroundColor = '#FFFFFF';
          statusText.innerText = `[08:00 AM] MEAN REVERSION: Institutional algorithms re-entered market, stabilizing rate at 12.90 MXN.`;
        }

        chart.update();
        i++;
        if (i >= newData.length) clearInterval(interval);
      }, 400);
    }

    window.onload = initChart;
  </script>
</body>
</html>
